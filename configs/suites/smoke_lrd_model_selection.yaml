manifest_id: smoke_lrd_model_selection_v1
name: smoke_lrd_model_selection
description: >-
  Tiny smoke benchmark for per-series LRD model selection: discriminators emit a
  [0,1] score for the lrd_class estimand, scored by ROC-AUC against binary is_lrd
  labels (fGn H=0.8 = LRD; fGn H=0.5 and multi_timescale = not-LRD).
mode: ground_truth
source:
  type: generator_grid
  generators:
    - family: fGn
      params:
        H: [0.5, 0.8]
        n: [512]
        sigma: [1.0]
      replicates: 3
    - family: multi_timescale
      params:
        n: [512]
        tau_max: [8.0]
        sigma: [1.0]
      replicates: 3
estimators:
  - name: ThresholdHurstDiscriminator
    family: discrimination
    target_estimand: lrd_class
    supports_ci: true
    params:
      base: dfa
      h0: 0.55
      width: 0.05
      n_bootstrap: 24
      ci_levels: [0.95]
metrics:
  - roc_auc
  - balanced_accuracy
  - true_positive_rate
  - false_positive_rate
  - validity_rate
  - runtime
leaderboards:
  - name: discrimination_power
    mode: ground_truth
    component_metrics: [roc_auc, validity_rate, runtime]
    weights:
      roc_auc: 0.8
      validity_rate: 0.1
      runtime: 0.1
    ranking_rule: weighted_rank
    tie_break_rule: best_primary_metric
report:
  formats: [html, csv]
  include_provenance: true
  export_root: reports
seeds:
  global_seed: 42
