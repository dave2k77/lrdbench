manifest_id: smoke_neural_timescale_v1
name: smoke_neural_timescale
description: >-
  Tiny smoke benchmark exercising the H / beta / tau estimand triangle:
  fGn carries (Hurst, spectral exponent) and fOU carries (Hurst, timescale).
mode: ground_truth
source:
  type: generator_grid
  generators:
    - family: fGn
      params:
        H: [0.7]
        n: [256]
        sigma: [1.0]
      replicates: 1
    - family: fOU
      params:
        H: [0.5]
        theta: [0.1]
        dt: [1.0]
        n: [256]
        sigma: [1.0]
      replicates: 1
estimators:
  - name: DFA
    family: temporal
    target_estimand: hurst_scaling_proxy
    supports_ci: true
    params:
      n_bootstrap: 48
      bootstrap_block_len: 24
      ci_levels: [0.95]
  - name: PeriodogramBeta
    family: spectral
    target_estimand: spectral_exponent_beta
    supports_ci: true
    params:
      n_bootstrap: 48
      bootstrap_block_len: 24
      ci_levels: [0.95]
  - name: ACFDecay
    family: timescale
    target_estimand: timescale_tau
    supports_ci: true
    params:
      n_bootstrap: 48
      bootstrap_block_len: 24
      ci_levels: [0.95]
metrics:
  - bias
  - mae
  - validity_rate
  - runtime
  - name: coverage
    levels: [0.95]
  - name: ci_width
    levels: [0.95]
leaderboards:
  - name: reliability
    mode: ground_truth
    component_metrics: [validity_rate, runtime]
    weights:
      validity_rate: 0.7
      runtime: 0.3
    ranking_rule: weighted_rank
    tie_break_rule: runtime
report:
  formats: [html, csv]
  include_provenance: true
  export_root: reports
seeds:
  global_seed: 42
