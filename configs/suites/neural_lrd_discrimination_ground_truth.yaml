manifest_id: neural_lrd_discrimination_gt_v1
name: neural_lrd_discrimination_ground_truth
description: >-
  True-vs-apparent long-range-dependence discrimination. The multi_timescale
  generator is a finite superposition of AR(1) timescales: genuinely short-memory
  (truth H = 0.5) but engineered to mimic power-law scaling over finite samples,
  with severity graded by tau_max (apparent Hurst ~ 0.6 / 0.7 / 0.8 for tau_max
  4 / 8 / 16 at n = 2048). Clean fGn H = 0.5 is the honest null; fGn H = 0.7, 0.8
  are true-LRD positives for contrast. The false_positive_lrd_rate metric scores
  how often each estimator reports LRD (H >= 0.6) on the H = 0.5 nulls -- i.e. its
  vulnerability to the apparent-LRD illusion the neural-timescales literature warns
  about.
mode: ground_truth
source:
  type: generator_grid
  generators:
    # Apparent-LRD nulls (short-memory) at graded severity.
    - family: multi_timescale
      params:
        n: [2048]
        tau_max: [4.0, 8.0, 16.0]
        n_components: [8]
        beta_target: [1.0]
        sigma: [1.0]
      replicates: 8
    # Clean short-memory null.
    - family: fGn
      params:
        H: [0.5]
        n: [2048]
        sigma: [1.0]
      replicates: 8
    # True-LRD positives (contrast: not counted in false-positive rate).
    - family: fGn
      params:
        H: [0.7, 0.8]
        n: [2048]
        sigma: [1.0]
      replicates: 8
estimators:
  - name: DFA
    family: temporal
    target_estimand: hurst_scaling_proxy
    supports_ci: true
    params:
      n_bootstrap: 200
      ci_levels: [0.95]
  - name: RS
    family: temporal
    target_estimand: hurst_scaling_proxy
    supports_ci: true
    params:
      n_bootstrap: 200
      ci_levels: [0.95]
  - name: GPH
    family: spectral
    target_estimand: hurst_scaling_proxy
    supports_ci: true
    params:
      n_bootstrap: 200
      ci_levels: [0.95]
  - name: WhittleMLE
    family: spectral
    target_estimand: hurst_scaling_proxy
    supports_ci: true
    params:
      n_bootstrap: 200
      ci_levels: [0.95]
  - name: WaveletOLS
    family: wavelet
    target_estimand: hurst_scaling_proxy
    supports_ci: true
    params:
      n_bootstrap: 200
      ci_levels: [0.95]
metrics:
  - bias
  - mae
  - false_positive_lrd_rate
  - validity_rate
  - runtime
  - cross_estimator_dispersion
  - name: coverage
    levels: [0.95]
leaderboards:
  - name: null_specificity
    mode: ground_truth
    component_metrics: [false_positive_lrd_rate, validity_rate, runtime]
    weights:
      false_positive_lrd_rate: 0.7
      validity_rate: 0.2
      runtime: 0.1
    ranking_rule: weighted_rank
    tie_break_rule: best_primary_metric
report:
  formats: [html, csv, latex]
  include_provenance: true
  export_root: reports
seeds:
  global_seed: 20260713
