name: docs

# Root Markdown snippets, manifests, research packages and dependency changes can
# affect the site too. Always build instead of maintaining an incomplete path list.
on: [push, pull_request]

jobs:
  mkdocs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with docs extras
        run: pip install ".[docs]"
      - name: MkDocs strict build
        run: mkdocs build --strict
