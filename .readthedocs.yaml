# Read the Docs configuration: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

# Match Material search exclusions in the hosted server-side search index.
search:
  ignore:
    - 404.html
    - development_handoff/*
    - observational_readiness_plan/*
    - public_release_roadmap/*
    - release_candidate_freeze/*
